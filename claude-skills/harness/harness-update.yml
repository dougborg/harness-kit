# Vendored by harness-kit's vendor-snapshot.sh and owned by .harness/lock.json:
# the next update replaces this file, and the edit check fails if it is edited.
#
# When harness-kit publishes a release newer than the snapshot in
# .harness/lock.json, this opens (or updates) one pull request that replaces
# the snapshot. The PR changes only the snapshot's files, .harness/lock.json,
# and the hook entries in .claude/settings.json; the job fails rather than
# push anything else. It uses GITHUB_TOKEN, and the repository must allow
# GitHub Actions to create pull requests (Settings > Actions > General).
# GITHUB_TOKEN can't push a change to this file, and its PRs don't start
# pull_request workflows; the optional HARNESS_UPDATE_TOKEN secret fixes
# both (.claude/skills/harness/vendoring.md, "The update workflow").
name: Harness update

on:
  schedule:
    # Set by [update] schedule in .harness/config.toml when the config has
    # one: change that key and re-run vendor-snapshot.sh, not this line.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release's scripts run in this job; keep the token out of
          # .git/config. harness-update.sh passes it to git only to push.
          persist-credentials: false

      - name: Update the vendored harness snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          # owner/repo of the harness to follow; unset means
          # .claude/harness-upstream, then dougborg/harness-kit.
          HARNESS_UPSTREAM: ${{ vars.HARNESS_UPSTREAM }}
          # Optional: a fine-grained token for this repository with Contents,
          # Pull requests, and Workflows read and write. Used only to push
          # the update branch and open the PR; the release's scripts never
          # see it. Unset means GITHUB_TOKEN.
          HARNESS_UPDATE_TOKEN: ${{ secrets.HARNESS_UPDATE_TOKEN }}
        run: .claude/skills/harness/harness-update.sh
