name: Idea or skill request
description: A change to a skill or agent, or a new one, ideally grounded in a session where it fell short.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read [`SCOPE.md`](https://github.com/dougborg/harness-kit/blob/main/SCOPE.md) and check [`.out-of-scope/`](https://github.com/dougborg/harness-kit/tree/main/.out-of-scope) for an earlier decision on the same idea. From a project that uses harness-kit, the `harness-issue` skill files this for you.

  - type: checkboxes
    id: read-scope
    attributes:
      label: Before filing
      options:
        - label: I've read `SCOPE.md` and checked `.out-of-scope/`, and neither covers this.
          required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Change to an existing skill or agent
        - New skill
        - New agent
        - Meta-harness (audit, bootstrap, update, retro, hoist)
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What
      description: The change you want, as concretely as you can.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The session where this would have helped, what happened there, and why an existing skill doesn't cover it.
    validations:
      required: true

  - type: textarea
    id: sketch
    attributes:
      label: Suggested change
      description: A sketch of the fix or the new skill's steps, if you have one.
