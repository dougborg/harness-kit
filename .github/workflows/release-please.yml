name: Release Please

on:
  push:
    branches: [main]

# Release PRs are opened with an installation token minted from the
# release-please GitHub App instead of GITHUB_TOKEN, so the pull_request
# workflows behind the required status checks actually run on them
# (GITHUB_TOKEN-authored events never trigger downstream workflows).
# The default GITHUB_TOKEN is unused, so it gets no permissions.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Without the App credentials the job fails here with a clear message
      # rather than inside create-github-app-token, and never falls back to
      # GITHUB_TOKEN.
      - name: Require the release App credentials
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$PRIVATE_KEY_SET" != "true" ]; then
            echo "::error::Set the RELEASE_PLEASE_APP_ID variable and RELEASE_PLEASE_APP_PRIVATE_KEY secret (dougborg-release-please App); see the README Releases section."
            exit 1
          fi

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses: the release branch, tags and
          # Releases (contents), the release PR (pull-requests), and its
          # autorelease labels (issues).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
